<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Speed Timer</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:700px;
  height:100vh;
  position:relative;
  padding:18px 16px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ================= SCRAMBLE ================= */

.scramble{
  width:100%;
  max-width:650px;
  text-align:center;
  font-size:25px;
  line-height:1.35;
  font-weight:700;
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:4px 10px;
  margin-top:8px;
}

/* ================= INSPECTION ================= */

.instruction{
  color:#777;
  font-size:19px;
  margin-top:8px;
  min-height:28px;
  text-align:center;
}

/* ================= TIMER ================= */

.timer{
  font-size:120px;
  line-height:1;
  font-weight:700;
  letter-spacing:-5px;
  margin-top:65px;
  height:135px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= MINI CUBE ================= */

.cube-area{
  width:100%;
  display:flex;
  justify-content:center;
  margin-top:15px;
}

.cube{
  width:190px;
  height:190px;
  display:grid;
  grid-template-columns:repeat(12,15px);
  grid-template-rows:repeat(9,15px);
  gap:1px;
  justify-content:center;
  align-content:center;
}

/*
Net:

              U
          L   F   R   B
              D
*/

.sticker{
  width:15px;
  height:15px;
  border-radius:2px;
}

/* positions in 12x9 net */

.u{ grid-column:4 / span 3; }
.l{ grid-column:1 / span 3; }
.f{ grid-column:4 / span 3; }
.r{ grid-column:7 / span 3; }
.b{ grid-column:10 / span 3; }
.d{ grid-column:4 / span 3; }

.face{
  display:grid;
  grid-template-columns:repeat(3,15px);
  grid-template-rows:repeat(3,15px);
  gap:1px;
}

.face.u{ grid-row:1; }
.face.l,.face.f,.face.r,.face.b{ grid-row:4; }
.face.d{ grid-row:7; }

.white{background:#f5f5f5;}
.yellow{background:#ffd91a;}
.green{background:#18c46b;}
.blue{background:#2388ff;}
.red{background:#ef3b3b;}
.orange{background:#ff8717;}

/* ================= STATS ================= */

.stats{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:55px;
  margin-top:18px;
  font-size:28px;
  white-space:nowrap;
}

.stat-label{
  color:#eee;
}

/* ================= HISTORY ================= */

.history-btn{
  width:75%;
  max-width:430px;
  height:75px;
  border:0;
  border-radius:30px;
  background:#1c1c1c;
  color:white;
  font-size:23px;
  font-weight:700;
  margin-top:22px;
}

.history-btn:active{
  background:#292929;
}

/* ================= HISTORY PANEL ================= */

.history-panel{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:65vh;
  background:#151515;
  border-radius:30px 30px 0 0;
  padding:22px 18px;
  transform:translateY(110%);
  transition:.25s ease;
  z-index:20;
  overflow:auto;
}

.history-panel.open{
  transform:translateY(0);
}

.history-title{
  text-align:center;
  font-size:26px;
  font-weight:700;
  margin-bottom:20px;
}

.close-history{
  position:absolute;
  right:20px;
  top:17px;
  border:0;
  background:none;
  color:white;
  font-size:28px;
}

.solve-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px 8px;
  border-bottom:1px solid #333;
  font-size:20px;
}

.solve-actions{
  display:flex;
  gap:7px;
}

.solve-actions button{
  border:0;
  border-radius:8px;
  background:#292929;
  color:white;
  padding:7px 9px;
}

.clear-all{
  width:100%;
  margin-top:20px;
  padding:13px;
  border:0;
  border-radius:14px;
  background:#292929;
  color:white;
  font-size:17px;
}

/* ================= MOBILE ================= */

@media(max-width:500px){

  .app{
    padding-top:12px;
  }

  .scramble{
    font-size:22px;
    min-height:76px;
    margin-top:3px;
  }

  .instruction{
    font-size:17px;
    margin-top:4px;
  }

  .timer{
    font-size:95px;
    height:110px;
    margin-top:50px;
  }

  .cube-area{
    margin-top:5px;
  }

  .cube{
    transform:scale(.92);
    transform-origin:center;
  }

  .stats{
    font-size:25px;
    gap:38px;
    margin-top:8px;
  }

  .history-btn{
    height:68px;
    margin-top:18px;
    font-size:21px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div id="scramble" class="scramble"></div>

  <div id="instruction" class="instruction">
    Chạm để bắt đầu inspection
  </div>

  <div id="timer" class="timer">0.00</div>

  <div class="cube-area">
    <div id="cube" class="cube"></div>
  </div>

  <div class="stats">
    <div class="stat-label">
      Solves: <span id="solves">0</span>
    </div>

    <div class="stat-label">
      PB: <span id="pb">--</span>
    </div>
  </div>

  <button class="history-btn" id="historyBtn">
    HISTORY
  </button>

  <div class="history-panel" id="historyPanel">
    <button class="close-history" id="closeHistory">×</button>

    <div class="history-title">HISTORY</div>

    <div id="historyList"></div>

    <button class="clear-all" id="clearAll">
      CLEAR ALL
    </button>
  </div>

</div>

<script>

/* =========================================================
   3D STICKER CUBE
   ========================================================= */

const COLORS = {
  U:"white",
  D:"yellow",
  F:"green",
  B:"blue",
  R:"red",
  L:"orange"
};

/*
 Mỗi sticker có:
 position = vị trí cubie
 normal   = mặt sticker đang hướng ra ngoài

 x: L=-1, M=0, R=1
 y: D=-1, E=0, U=1
 z: B=-1, M=0, F=1
*/

let stickers = [];

function createSolvedCube(){

  stickers=[];

  const faces=[
    {face:"U", normal:[0,1,0]},
    {face:"D", normal:[0,-1,0]},
    {face:"F", normal:[0,0,1]},
    {face:"B", normal:[0,0,-1]},
    {face:"R", normal:[1,0,0]},
    {face:"L", normal:[-1,0,0]}
  ];

  for(const f of faces){

    for(let row=0;row<3;row++){

      for(let col=0;col<3;col++){

        let x=0,y=0,z=0;

        if(f.face==="U"){
          x=col-1;
          y=1;
          z=row-1;
        }

        if(f.face==="D"){
          x=col-1;
          y=-1;
          z=1-row;
        }

        if(f.face==="F"){
          x=col-1;
          y=1-row;
          z=1;
        }

        if(f.face==="B"){
          x=1-col;
          y=1-row;
          z=-1;
        }

        if(f.face==="R"){
          x=1;
          y=1-row;
          z=1-col;
        }

        if(f.face==="L"){
          x=-1;
          y=1-row;
          z=col-1;
        }

        stickers.push({
          color:f.face,
          x,y,z,
          nx:f.normal[0],
          ny:f.normal[1],
          nz:f.normal[2]
        });

      }
    }
  }
}

/* ================= ROTATION ================= */

function rotateVector(v,axis,dir){

  let [x,y,z]=v;

  if(axis==="x"){

    if(dir===-1){
      return [x,z,-y];
    }else{
      return [x,-z,y];
    }

  }

  if(axis==="y"){

    if(dir===-1){
      return [-z,y,x];
    }else{
      return [z,y,-x];
    }

  }

  if(axis==="z"){

    if(dir===-1){
      return [y,-x,z];
    }else{
      return [-y,x,z];
    }

  }
}

function rotateLayer(axis,layer,dir){

  for(const s of stickers){

    if(
      (axis==="x" && s.x===layer) ||
      (axis==="y" && s.y===layer) ||
      (axis==="z" && s.z===layer)
    ){

      let p=rotateVector([s.x,s.y,s.z],axis,dir);

      s.x=p[0];
      s.y=p[1];
      s.z=p[2];

      let n=rotateVector([s.nx,s.ny,s.nz],axis,dir);

      s.nx=n[0];
      s.ny=n[1];
      s.nz=n[2];
    }
  }
}

/* ================= SINGMASTER MOVES ================= */

function move(face){

  switch(face){

    case "R":
      rotateLayer("x",1,-1);
      break;

    case "L":
      rotateLayer("x",-1,1);
      break;

    case "U":
      rotateLayer("y",1,-1);
      break;

    case "D":
      rotateLayer("y",-1,1);
      break;

    case "F":
      rotateLayer("z",1,-1);
      break;

    case "B":
      rotateLayer("z",-1,1);
      break;
  }
}

function applyMove(m){

  let face=m[0];

  move(face);

  if(m.includes("2")){
    move(face);
  }
}

/* =========================================================
   SCRAMBLE
   ========================================================= */

const faces=["R","L","U","D","F","B"];
const axes={
  R:"x",L:"x",
  U:"y",D:"y",
  F:"z",B:"z"
};

function randomScramble(){

  let result=[];
  let lastFace=null;
  let lastAxis=null;

  while(result.length<20){

    const face=
      faces[Math.floor(Math.random()*faces.length)];

    const axis=axes[face];

    if(face===lastFace) continue;
    if(axis===lastAxis) continue;

    const suffixes=["","'","2"];
    const suffix=
      suffixes[Math.floor(Math.random()*suffixes.length)];

    result.push(face+suffix);

    lastFace=face;
    lastAxis=axis;
  }

  return result;
}

/* =========================================================
   MINI CUBE RENDER
   ========================================================= */

function getFaceStickers(face){

  return stickers.filter(s=>{

    if(face==="U") return s.ny===1;
    if(face==="D") return s.ny===-1;
    if(face==="F") return s.nz===1;
    if(face==="B") return s.nz===-1;
    if(face==="R") return s.nx===1;
    if(face==="L") return s.nx===-1;

  });
}

function sortFace(face,list){

  return list.sort((a,b)=>{

    let ra,rb,ca,cb;

    if(face==="U"){
      ra=-a.z;
      rb=-b.z;
      ca=a.x;
      cb=b.x;
    }

    if(face==="D"){
      ra=a.z;
      rb=b.z;
      ca=a.x;
      cb=b.x;
    }

    if(face==="F"){
      ra=-a.y;
      rb=-b.y;
      ca=a.x;
      cb=b.x;
    }

    if(face==="B"){
      ra=-a.y;
      rb=-b.y;
      ca=-a.x;
      cb=-b.x;
    }

    if(face==="R"){
      ra=-a.y;
      rb=-b.y;
      ca=-a.z;
      cb=-b.z;
    }

    if(face==="L"){
      ra=-a.y;
      rb=-b.y;
      ca=a.z;
      cb=b.z;
    }

    return ra-rb || ca-cb;
  });
}

function renderFace(face){

  const faceDiv=document.createElement("div");

  faceDiv.className=`face ${face.toLowerCase()}`;

  let list=getFaceStickers(face);

  sortFace(face,list);

  for(const s of list){

    const el=document.createElement("div");

    el.className="sticker "+COLORS[s.color];

    faceDiv.appendChild(el);
  }

  return faceDiv;
}

function renderCube(){

  const cube=document.getElementById("cube");

  cube.innerHTML="";

  cube.appendChild(renderFace("U"));
  cube.appendChild(renderFace("L"));
  cube.appendChild(renderFace("F"));
  cube.appendChild(renderFace("R"));
  cube.appendChild(renderFace("B"));
  cube.appendChild(renderFace("D"));
}

/* =========================================================
   SCRAMBLE + NEW SOLVE
   ========================================================= */

let currentScramble=[];

function newScramble(){

  createSolvedCube();

  currentScramble=randomScramble();

  for(const m of currentScramble){
    applyMove(m);
  }

  document.getElementById("scramble").textContent=
    currentScramble.join(" ");

  renderCube();
}

newScramble();

/* =========================================================
   TIMER
   ========================================================= */

let phase="idle";

let inspectionStart=0;
let inspectionInterval=null;

let solveStart=0;
let solveInterval=null;

let holdTimer=null;
let holding=false;

let elapsed=0;

const timer=document.getElementById("timer");
const instruction=document.getElementById("instruction");

function formatTime(ms){

  return (ms/1000).toFixed(2);
}

function updateSolveTimer(){

  elapsed=Date.now()-solveStart;

  timer.textContent=formatTime(elapsed);
}

/* ================= INSPECTION ================= */

function startInspection(){

  if(phase!=="idle") return;

  phase="inspection";

  inspectionStart=Date.now();

  instruction.textContent=
    "Giữ để bắt đầu solve";

  timer.textContent="15.00";
  timer.style.color="white";

  clearInterval(inspectionInterval);

  inspectionInterval=setInterval(()=>{

    const left=
      15000-(Date.now()-inspectionStart);

    if(left<=0){

      clearInterval(inspectionInterval);

      timer.textContent="DNF";
      timer.style.color="#ff3030";

      phase="dnf";

      setTimeout(()=>{
        resetIdle();
      },1200);

      return;
    }

    timer.textContent=
      (left/1000).toFixed(2);

    if(left<=8000){
      timer.style.color="#ff3030";
    }else{
      timer.style.color="#ffd02f";
    }

  },20);
}

/* ================= HOLD ================= */

function startHold(){

  if(phase!=="inspection") return;

  holding=true;

  timer.style.color="#39ff6a";

  holdTimer=setTimeout(()=>{

    if(!holding) return;

    phase="ready";

    timer.textContent="0.00";

    instruction.textContent=
      "Thả tay để bắt đầu";

  },350);
}

function cancelHold(){

  holding=false;

  clearTimeout(holdTimer);

  if(phase==="ready"){

    startSolve();

  }
}

/* ================= SOLVE ================= */

function startSolve(){

  clearInterval(inspectionInterval);

  phase="solve";

  solveStart=Date.now();

  timer.style.color="white";

  instruction.textContent=
    "Đang solve";

  clearInterval(solveInterval);

  solveInterval=setInterval(
    updateSolveTimer,
    10
  );
}

function finishSolve(){

  if(phase!=="solve") return;

  clearInterval(solveInterval);

  elapsed=Date.now()-solveStart;

  timer.textContent=
    formatTime(elapsed);

  timer.style.color="white";

  instruction.textContent=
    "Chạm để bắt đầu inspection";

  addSolve(elapsed);

  phase="idle";

  setTimeout(()=>{
    newScramble();
  },500);
}

function resetIdle(){

  clearInterval(inspectionInterval);
  clearInterval(solveInterval);

  clearTimeout(holdTimer);

  phase="idle";
  holding=false;

  timer.textContent="0.00";
  timer.style.color="white";

  instruction.textContent=
    "Chạm để bắt đầu inspection";

  newScramble();
}

/* =========================================================
   INPUT
   ========================================================= */

document.addEventListener("pointerdown",e=>{

  if(
    e.target.closest(".history-panel") ||
    e.target.closest(".history-btn")
  ) return;

  if(phase==="idle"){
    startInspection();
    return;
  }

  if(phase==="inspection"){
    startHold();
    return;
  }

  if(phase==="solve"){
    finishSolve();
    return;
  }

});

document.addEventListener("pointerup",e=>{

  if(phase==="inspection" || phase==="ready"){
    cancelHold();
  }

});

/* =========================================================
   HISTORY
   ========================================================= */

let solves=
  JSON.parse(localStorage.getItem("rubikSolves")||"[]");

function saveSolves(){

  localStorage.setItem(
    "rubikSolves",
    JSON.stringify(solves)
  );
}

function getPB(){

  const valid=
    solves
      .filter(x=>!x.dnf)
      .map(x=>x.time);

  if(!valid.length) return null;

  return Math.min(...valid);
}

function updateStats(){

  document.getElementById("solves").textContent=
    solves.length;

  const pb=getPB();

  document.getElementById("pb").textContent=
    pb===null
      ? "--"
      : formatTime(pb);
}

function addSolve(ms){

  solves.unshift({
    time:ms,
    dnf:false,
    date:Date.now()
  });

  saveSolves();
  updateStats();
  renderHistory();
}

function renderHistory(){

  const list=
    document.getElementById("historyList");

  list.innerHTML="";

  if(!solves.length){

    list.innerHTML=
      '<div style="text-align:center;color:#777">Chưa có solve</div>';

    return;
  }

  solves.forEach((s,i)=>{

    const row=
      document.createElement("div");

    row.className="solve-row";

    row.innerHTML=`
      <span>#${solves.length-i}</span>
      <strong>${s.dnf?"DNF":formatTime(s.time)}</strong>
      <div class="solve-actions">
        <button onclick="plusTwo(${i})">+2</button>
        <button onclick="toggleDNF(${i})">DNF</button>
        <button onclick="deleteSolve(${i})">×</button>
      </div>
    `;

    list.appendChild(row);
  });
}

function plusTwo(i){

  if(solves[i].dnf) return;

  solves[i].time+=2000;

  saveSolves();
  updateStats();
  renderHistory();
}

function toggleDNF(i){

  solves[i].dnf=!solves[i].dnf;

  saveSolves();
  updateStats();
  renderHistory();
}

function deleteSolve(i){

  solves.splice(i,1);

  saveSolves();
  updateStats();
  renderHistory();
}

document.getElementById("clearAll")
.addEventListener("click",()=>{

  solves=[];

  saveSolves();
  updateStats();
  renderHistory();

});

document.getElementById("historyBtn")
.addEventListener("click",()=>{

  document
    .getElementById("historyPanel")
    .classList.add("open");

});

document.getElementById("closeHistory")
.addEventListener("click",()=>{

  document
    .getElementById("historyPanel")
    .classList.remove("open");

});

/* ================= INIT ================= */

updateStats();
renderHistory();

</script>

</body>
</html>
