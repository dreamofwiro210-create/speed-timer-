<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rubik Speed Timer</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif
}

button{
  font:inherit
}

#app{
  position:fixed;
  inset:0;
  background:#050505;
  touch-action:none;
  user-select:none
}

#scramble{
  position:absolute;
  top:18px;
  left:12px;
  right:12px;
  text-align:center;
  font-size:clamp(18px,5vw,34px);
  font-weight:800;
  line-height:1.3
}

#hint{
  position:absolute;
  top:78px;
  left:0;
  right:0;
  text-align:center;
  color:#666;
  font-size:14px
}

#timer{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(82px,23vw,175px);
  font-weight:700;
  letter-spacing:-5px;
  pointer-events:none
}

#stats{
  position:absolute;
  left:50%;
  bottom:125px;
  transform:translateX(-50%);
  width:calc(100% - 155px);
  display:flex;
  justify-content:center;
  align-items:center;
  gap:45px;
  white-space:nowrap;
  font-size:18px;
  pointer-events:none
}

#stats b{
  font-size:29px
}

/* MINI CUBE */

#cube{
  position:absolute;
  left:12px;
  bottom:90px;
  width:115px;
  height:115px;
  padding:4px;
  border-radius:10px;
  background:#111;
  display:grid;
  grid-template-columns:repeat(12,1fr);
  grid-template-rows:repeat(9,1fr);
  gap:2px;
  pointer-events:none
}

.face{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:2px
}

.s{
  border-radius:2px
}

#U{
  grid-column:4/7;
  grid-row:1/4
}

#L{
  grid-column:1/4;
  grid-row:4/7
}

#F{
  grid-column:4/7;
  grid-row:4/7
}

#R{
  grid-column:7/10;
  grid-row:4/7
}

#B{
  grid-column:10/13;
  grid-row:4/7
}

#D{
  grid-column:4/7;
  grid-row:7/10
}

/* HISTORY BUTTON */

#historyBtn{
  position:absolute;
  left:50%;
  bottom:32px;
  transform:translateX(-50%);
  z-index:5;
  border:0;
  border-radius:20px;
  background:#191919;
  color:#fff;
  padding:14px 62px;
  font-size:20px;
  font-weight:800
}

/* HISTORY PAGE */

#history{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  background:#080808;
  overflow:auto
}

#head{
  position:sticky;
  top:0;
  height:70px;
  background:#111;
  display:flex;
  align-items:center;
  padding:0 12px;
  z-index:2
}

#back{
  border:0;
  background:none;
  color:#fff;
  font-size:45px;
  width:52px
}

#title{
  font-size:24px;
  font-weight:800
}

#clear{
  margin-left:auto;
  border:0;
  border-radius:10px;
  background:#252525;
  color:#fff;
  padding:9px 12px
}

#list{
  padding:12px
}

.item{
  background:#151515;
  border-radius:15px;
  padding:13px;
  margin-bottom:10px
}

.time{
  font-size:29px;
  font-weight:800
}

.dnf{
  color:#ff453a
}

.p2{
  color:#ffd02f
}

.scr{
  margin-top:7px;
  color:#999;
  font-size:14px;
  line-height:1.4
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:10px
}

.actions button{
  border:0;
  border-radius:9px;
  background:#252525;
  color:#fff;
  padding:8px 11px
}

.empty{
  text-align:center;
  color:#777;
  padding:50px
}

@media(max-height:700px){

  #stats{
    bottom:92px
  }

  #historyBtn{
    bottom:15px
  }

  #cube{
    bottom:65px
  }

}
</style>
</head>

<body>

<div id="app">

  <div id="scramble">---</div>

  <div id="hint">
    Chạm để bắt đầu inspection
  </div>

  <div id="timer">
    0.00
  </div>

  <div id="cube"></div>

  <div id="stats">
    <span>
      Solves: <b id="solves">0</b>
    </span>

    <span>
      PB: <b id="pb">--</b>
    </span>
  </div>

  <button id="historyBtn">
    HISTORY
  </button>

</div>


<div id="history">

  <div id="head">

    <button id="back">
      ‹
    </button>

    <div id="title">
      History
    </div>

    <button id="clear">
      Clear All
    </button>

  </div>

  <div id="list"></div>

</div>


<script>

/* =========================
   MÀU CUBE
========================= */

const COLORS={
  U:"#fff",
  R:"#e53935",
  F:"#21c66b",
  D:"#ffd92f",
  L:"#ff8a18",
  B:"#2f7df6"
};

const faces=[
  "U",
  "R",
  "F",
  "D",
  "L",
  "B"
];

let cube={};

let scramble=[];

let phase="idle";

let inspectionStart=0;

let solveStart=0;

let held=false;

let armed=false;

let raf=0;


/* =========================
   RESET CUBE
========================= */

function resetCube(){

  cube={};

  faces.forEach(f=>{
    cube[f]=Array(9).fill(f);
  });

}


/* =========================
   XOAY MẶT
========================= */

function rot(f){

  let a=cube[f];

  cube[f]=[
    a[6],a[3],a[0],
    a[7],a[4],a[1],
    a[8],a[5],a[2]
  ];

}


/* =========================
   U
========================= */

function U(){

  rot("U");

  let t=cube.F.slice(0,3);

  cube.F.splice(
    0,3,
    ...cube.L.slice(0,3)
  );

  cube.L.splice(
    0,3,
    ...cube.B.slice(0,3)
  );

  cube.B.splice(
    0,3,
    ...cube.R.slice(0,3)
  );

  cube.R.splice(
    0,3,
    ...t
  );

}


/* =========================
   D
========================= */

function D(){

  rot("D");

  let t=cube.F.slice(6,9);

  cube.F.splice(
    6,3,
    ...cube.R.slice(6,9)
  );

  cube.R.splice(
    6,3,
    ...cube.B.slice(6,9)
  );

  cube.B.splice(
    6,3,
    ...cube.L.slice(6,9)
  );

  cube.L.splice(
    6,3,
    ...t
  );

}


/* =========================
   R
========================= */

function R(){

  rot("R");

  let t=[
    cube.U[2],
    cube.U[5],
    cube.U[8]
  ];

  [
    cube.U[2],
    cube.U[5],
    cube.U[8]
  ]=[
    cube.F[2],
    cube.F[5],
    cube.F[8]
  ];

  [
    cube.F[2],
    cube.F[5],
    cube.F[8]
  ]=[
    cube.D[2],
    cube.D[5],
    cube.D[8]
  ];

  [
    cube.D[2],
    cube.D[5],
    cube.D[8]
  ]=[
    cube.B[6],
    cube.B[3],
    cube.B[0]
  ];

  [
    cube.B[6],
    cube.B[3],
    cube.B[0]
  ]=t;

}


/* =========================
   L
========================= */

function L(){

  rot("L");

  let t=[
    cube.U[0],
    cube.U[3],
    cube.U[6]
  ];

  [
    cube.U[0],
    cube.U[3],
    cube.U[6]
  ]=[
    cube.B[8],
    cube.B[5],
    cube.B[2]
  ];

  [
    cube.B[8],
    cube.B[5],
    cube.B[2]
  ]=[
    cube.D[0],
    cube.D[3],
    cube.D[6]
  ];

  [
    cube.D[0],
    cube.D[3],
    cube.D[6]
  ]=[
    cube.F[0],
    cube.F[3],
    cube.F[6]
  ];

  [
    cube.F[0],
    cube.F[3],
    cube.F[6]
  ]=t;

}


/* =========================
   F
========================= */

function F(){

  rot("F");

  let t=[
    cube.U[6],
    cube.U[7],
    cube.U[8]
  ];

  [
    cube.U[6],
    cube.U[7],
    cube.U[8]
  ]=[
    cube.L[8],
    cube.L[5],
    cube.L[2]
  ];

  [
    cube.L[8],
    cube.L[5],
    cube.L[2]
  ]=[
    cube.D[2],
    cube.D[1],
    cube.D[0]
  ];

  [
    cube.D[2],
    cube.D[1],
    cube.D[0]
  ]=[
    cube.R[0],
    cube.R[3],
    cube.R[6]
  ];

  [
    cube.R[0],
    cube.R[3],
    cube.R[6]
  ]=t;

}


/* =========================
   B
========================= */

function B(){

  rot("B");

  let t=[
    cube.U[0],
    cube.U[1],
    cube.U[2]
  ];

  [
    cube.U[0],
    cube.U[1],
    cube.U[2]
  ]=[
    cube.R[2],
    cube.R[5],
    cube.R[8]
  ];

  [
    cube.R[2],
    cube.R[5],
    cube.R[8]
  ]=[
    cube.D[8],
    cube.D[7],
    cube.D[6]
  ];

  [
    cube.D[8],
    cube.D[7],
    cube.D[6]
  ]=[
    cube.L[6],
    cube.L[3],
    cube.L[0]
  ];

  [
    cube.L[6],
    cube.L[3],
    cube.L[0]
  ]=t;

}


/* =========================
   THỰC HIỆN MOVE
========================= */

const fn={
  U,
  R,
  D,
  L,
  F,
  B
};

function move(m){

  let f=m[0];

  let n=
    m.endsWith("2")
      ?2
      :m.endsWith("'")
        ?3
        :1;

  for(let i=0;i<n;i++){
    fn[f]();
  }

}


/* =========================
   SCRAMBLE 20 MOVE
========================= */

function makeScramble(){

  const fs=[
    "R","L","U",
    "D","F","B"
  ];

  const ss=[
    "",
    "'",
    "2"
  ];

  const ax={
    R:"x",
    L:"x",
    U:"y",
    D:"y",
    F:"z",
    B:"z"
  };

  let a=[];

  let last="";

  let lastAx="";

  while(a.length<20){

    let f=
      fs[
        Math.floor(
          Math.random()*fs.length
        )
      ];

    if(
      f===last ||
      ax[f]===lastAx
    ){
      continue;
    }

    let s=
      ss[
        Math.floor(
          Math.random()*ss.length
        )
      ];

    a.push(f+s);

    last=f;

    lastAx=ax[f];

  }

  return a;

}


/* =========================
   SCRAMBLE MỚI
========================= */

function newScramble(){

  resetCube();

  scramble=makeScramble();

  scramble.forEach(move);

  document.getElementById(
    "scramble"
  ).textContent=
    scramble.join(" ");

  renderCube();

}


/* =========================
   HIỂN THỊ CUBE
========================= */

function renderCube(){

  let root=
    document.getElementById("cube");

  root.innerHTML="";

  faces.forEach(f=>{

    let face=
      document.createElement("div");

    face.className="face";

    face.id=f;

    cube[f].forEach(c=>{

      let s=
        document.createElement("div");

      s.className="s";

      s.style.background=
        COLORS[c];

      face.appendChild(s);

    });

    root.appendChild(face);

  });

}


/* =========================
   TIMER
========================= */

const timer=
  document.getElementById("timer");

const hint=
  document.getElementById("hint");


function show(t,c="#fff"){

  timer.textContent=t;

  timer.style.color=c;

}


/* =========================
   INSPECTION
========================= */

function inspectionLoop(now){

  if(
    phase!=="inspection"
  ){
    return;
  }

  let left=
    15-
    (now-inspectionStart)/1000;

  if(left<=0){

    phase="stopped";

    held=false;

    armed=false;

    show(
      "DNF",
      "#ff453a"
    );

    hint.textContent=
      "DNF • chạm để inspection mới";

    add({
      time:null,
      dnf:true,
      plus2:false,
      scramble:scramble.join(" ")
    });

    newScramble();

    return;

  }

  show(
    String(Math.ceil(left)),
    held
      ?" #39ff6a"
      :left>8
        ?" #ff3030"
        :" #ffd02f"
  );

  /* sửa màu có khoảng trắng */
  timer.style.color=
    held
      ?" #39ff6a".trim()
      :left>8
        ?" #ff3030".trim()
        :" #ffd02f".trim();

  raf=
    requestAnimationFrame(
      inspectionLoop
    );

}


/* =========================
   BẮT ĐẦU INSPECTION
========================= */

function startInspection(){

  phase="inspection";

  inspectionStart=
    performance.now();

  held=false;

  armed=false;

  show(
    "15",
    "#ff3030"
  );

  hint.textContent=
    "Nhấn GIỮ để xanh";

  cancelAnimationFrame(raf);

  raf=
    requestAnimationFrame(
      inspectionLoop
    );

}


/* =========================
   NHẤN GIỮ
========================= */

function hold(){

  if(
    phase!=="inspection"
  ){
    return;
  }

  held=true;

  armed=true;

  let left=
    15-
    (performance.now()-inspectionStart)/1000;

  show(
    String(
      Math.max(
        1,
        Math.ceil(left)
      )
    ),
    "#39ff6a"
  );

  hint.textContent=
    "Thả tay để bắt đầu giải";

}


/* =========================
   THẢ TAY
========================= */

function release(){

  if(
    phase!=="inspection" ||
    !armed
  ){
    return;
  }

  phase="solving";

  held=false;

  armed=false;

  solveStart=
    performance.now();

  show(
    "0.00",
    "#fff"
  );

  hint.textContent=
    "Đang giải";

  cancelAnimationFrame(raf);

  raf=
    requestAnimationFrame(
      solveLoop
    );

}


/* =========================
   TIMER GIẢI
========================= */

function solveLoop(now){

  if(
    phase!=="solving"
  ){
    return;
  }

  show(
    (
      (now-solveStart)/1000
    ).toFixed(2),
    "#fff"
  );

  raf=
    requestAnimationFrame(
      solveLoop
    );

}


/* =========================
   DỪNG TIMER
========================= */

function stopSolve(){

  if(
    phase!=="solving"
  ){
    return;
  }

  let t=
    performance.now()-
    solveStart;

  phase="stopped";

  cancelAnimationFrame(raf);

  show(
    (t/1000).toFixed(2),
    "#fff"
  );

  hint.textContent=
    "Chạm để inspection mới";

  add({
    time:t,
    dnf:false,
    plus2:false,
    scramble:scramble.join(" ")
  });

  newScramble();

}


/* =========================
   TOÀN BỘ MÀN HÌNH TIMER
========================= */

document
  .getElementById("app")
  .addEventListener(
    "pointerdown",
    e=>{

      if(
        e.target.closest("button")
      ){
        return;
      }

      if(
        phase==="idle" ||
        phase==="stopped"
      ){

        startInspection();

      }else if(
        phase==="inspection"
      ){

        hold();

      }else if(
        phase==="solving"
      ){

        stopSolve();

      }

    }
  );


document
  .getElementById("app")
  .addEventListener(
    "pointerup",
    e=>{

      if(
        e.target.closest("button")
      ){
        return;
      }

      release();

    }
  );


document
  .getElementById("app")
  .addEventListener(
    "pointercancel",
    release
  );


/* =========================
   BÀN PHÍM SPACE
========================= */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.code!=="Space" ||
      e.repeat
    ){
      return;
    }

    e.preventDefault();

    if(
      phase==="idle" ||
      phase==="stopped"
    ){

      startInspection();

    }else if(
      phase==="inspection"
    ){

      hold();

    }else if(
      phase==="solving"
    ){

      stopSolve();

    }

  }
);


document.addEventListener(
  "keyup",
  e=>{

    if(
      e.code==="Space"
    ){

      e.preventDefault();

      release();

    }

  }
);


/* =========================
   HISTORY
========================= */

let historyData=[];

try{

  historyData=
    JSON.parse(
      localStorage.getItem(
        "rubikHistory"
      )||"[]"
    );

  if(
    !Array.isArray(historyData)
  ){
    historyData=[];
  }

}catch{

  historyData=[];

}


/* =========================
   SAVE
========================= */

function save(){

  localStorage.setItem(
    "rubikHistory",
    JSON.stringify(historyData)
  );

  renderHistory();

  updateStats();

}


/* =========================
   ADD SOLVE
========================= */

function add(x){

  historyData.unshift(x);

  save();

}


/* =========================
   SOLVES + PB
========================= */

function updateStats(){

  const valid=
    historyData.filter(
      x=>
        !x.dnf &&
        Number.isFinite(x.time)
    );

  document.getElementById(
    "solves"
  ).textContent=
    valid.length;

  const pb=
    valid.length
      ?Math.min(
        ...valid.map(
          x=>x.time
        )
      )
      :null;

  document.getElementById(
    "pb"
  ).textContent=
    pb===null
      ?"--"
      :(pb/1000).toFixed(2);

}


/* =========================
   HIỂN THỊ HISTORY
========================= */

function renderHistory(){

  const list=
    document.getElementById(
      "list"
    );

  if(
    !historyData.length
  ){

    list.innerHTML=
      '<div class="empty">Chưa có solve.</div>';

    return;

  }

  list.innerHTML="";

  historyData.forEach(
    (x,i)=>{

      let item=
        document.createElement(
          "div"
        );

      item.className="item";


      let t=
        document.createElement(
          "div"
        );

      t.className="time";


      if(x.dnf){

        t.textContent="DNF";

        t.classList.add(
          "dnf"
        );

      }else{

        t.textContent=
          (x.time/1000).toFixed(2)+
          (x.plus2?"+2":"");

        if(x.plus2){

          t.classList.add(
            "p2"
          );

        }

      }

      item.appendChild(t);


      let s=
        document.createElement(
          "div"
        );

      s.className="scr";

      s.textContent=
        x.scramble;

      item.appendChild(s);


      let a=
        document.createElement(
          "div"
        );

      a.className="actions";


      if(!x.dnf){

        let p=
          document.createElement(
            "button"
          );

        p.textContent=
          x.plus2
            ?"Remove +2"
            :"+2";

        p.onclick=()=>{

          historyData[i].plus2=
            !historyData[i].plus2;

          save();

        };

        a.appendChild(p);


        let d=
          document.createElement(
            "button"
          );

        d.textContent="DNF";

        d.onclick=()=>{

          historyData[i].dnf=true;

          historyData[i].time=null;

          historyData[i].plus2=false;

          save();

        };

        a.appendChild(d);

      }


      let del=
        document.createElement(
          "button"
        );

      del.textContent="Delete";

      del.onclick=()=>{

        historyData.splice(
          i,
          1
        );

        save();

      };

      a.appendChild(del);


      item.appendChild(a);

      list.appendChild(item);

    }
  );

}


/* =========================
   HISTORY PAGE
========================= */

document
  .getElementById("historyBtn")
  .onclick=e=>{

    e.stopPropagation();

    document.getElementById(
      "history"
    ).style.display="block";

    renderHistory();

  };


document
  .getElementById("back")
  .onclick=()=>{

    document.getElementById(
      "history"
    ).style.display="none";

  };


document
  .getElementById("clear")
  .onclick=()=>{

    if(
      confirm(
        "Xóa toàn bộ lịch sử?"
      )
    ){

      historyData=[];

      save();

    }

  };


/* =========================
   KHỞI ĐỘNG
========================= */

newScramble();

renderHistory();

updateStats();

</script>

</body>
</html>
