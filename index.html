<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Speed Timer</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button{
  font:inherit;
  color:inherit;
}

#timerPage{
  position:fixed;
  inset:0;
  background:#050505;
  touch-action:none;
  user-select:none;
}

#timer{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(92px,25vw,190px);
  font-weight:700;
  letter-spacing:-7px;
  color:#fff;
}

#scramble{
  position:absolute;
  top:max(22px,env(safe-area-inset-top));
  left:12px;
  right:12px;
  text-align:center;
  font-size:clamp(22px,6vw,42px);
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
}

#stats{
  position:absolute;
  bottom:118px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:70px;
  align-items:center;
  font-size:22px;
  font-weight:600;
  white-space:nowrap;
}

#stats b{
  font-size:34px;
}

#historyBtn{
  position:absolute;
  left:50%;
  bottom:38px;
  transform:translateX(-50%);
  border:0;
  border-radius:22px;
  background:#191919;
  padding:16px 70px;
  font-size:22px;
  font-weight:800;
  z-index:5;
}

#cube{
  position:absolute;
  left:18px;
  bottom:92px;
  width:112px;
  height:112px;
  z-index:4;
  background:#080808;
  border-radius:10px;
  padding:5px;
  display:grid;
  grid-template-columns:repeat(12,1fr);
  grid-template-rows:repeat(9,1fr);
  gap:3px;
}

.face{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:2px;
}

.sticker{
  border-radius:2px;
  min-width:0;
  min-height:0;
}

#U{
  grid-column:4/7;
  grid-row:1/4;
}

#L{
  grid-column:1/4;
  grid-row:4/7;
}

#F{
  grid-column:4/7;
  grid-row:4/7;
}

#R{
  grid-column:7/10;
  grid-row:4/7;
}

#B{
  grid-column:10/13;
  grid-row:4/7;
}

#D{
  grid-column:4/7;
  grid-row:7/10;
}

#historyPage{
  display:none;
  position:fixed;
  inset:0;
  background:#080808;
  z-index:20;
  overflow:auto;
}

#historyHead{
  position:sticky;
  top:0;
  height:76px;
  background:#101010;
  display:flex;
  align-items:center;
  padding:0 18px;
  z-index:2;
}

#back{
  border:0;
  background:transparent;
  font-size:42px;
  width:54px;
  line-height:1;
}

#historyTitle{
  font-size:25px;
  font-weight:800;
  margin-left:6px;
}

#clearAll{
  margin-left:auto;
  border:0;
  background:#222;
  border-radius:12px;
  padding:10px 14px;
  font-weight:700;
}

#historyList{
  padding:16px 14px 35px;
}

.item{
  background:#151515;
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
}

.itemTop{
  display:flex;
  align-items:center;
  gap:10px;
}

.time{
  font-size:29px;
  font-weight:800;
}

.dnf{
  color:#ff4545;
}

.plus2{
  color:#ffbd2e;
}

.itemScramble{
  margin-top:8px;
  font-size:15px;
  color:#aaa;
  line-height:1.35;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.actions button{
  border:0;
  border-radius:10px;
  background:#242424;
  padding:8px 11px;
  font-weight:700;
}

.empty{
  text-align:center;
  color:#777;
  padding:50px 20px;
  font-size:18px;
}

@media(max-height:700px){
  #stats{
    bottom:92px;
  }

  #historyBtn{
    bottom:18px;
  }

  #cube{
    bottom:68px;
  }
}
</style>
</head>

<body>

<section id="timerPage">

  <div id="scramble">---</div>

  <div id="timer">0.00</div>

  <div id="cube"></div>

  <div id="stats">
    <span>Solves: <b id="solves">0</b></span>
    <span>PB: <b id="pb">--</b></span>
  </div>

  <button id="historyBtn">HISTORY</button>

</section>


<section id="historyPage">

  <header id="historyHead">

    <button id="back">‹</button>

    <div id="historyTitle">History</div>

    <button id="clearAll">Clear All</button>

  </header>

  <div id="historyList"></div>

</section>


<script>

const COLORS={
  U:"#ffffff",
  R:"#e53935",
  F:"#25c96f",
  D:"#ffd92f",
  L:"#ff8a18",
  B:"#2f7df6"
};

const FACES=["U","R","F","D","L","B"];

const FACE_INFO={

  U:{
    n:[0,1,0],
    right:[1,0,0],
    up:[0,0,-1]
  },

  D:{
    n:[0,-1,0],
    right:[1,0,0],
    up:[0,0,1]
  },

  F:{
    n:[0,0,1],
    right:[1,0,0],
    up:[0,1,0]
  },

  B:{
    n:[0,0,-1],
    right:[-1,0,0],
    up:[0,1,0]
  },

  R:{
    n:[1,0,0],
    right:[0,0,-1],
    up:[0,1,0]
  },

  L:{
    n:[-1,0,0],
    right:[0,0,1],
    up:[0,1,0]
  }

};


let state=[];

let scrambleMoves=[];

let scrambleText="";

let phase="idle";

let inspectionStart=0;

let solveStart=0;

let raf=0;

let inspectionHeld=false;

let inspectionArmed=false;

let history=JSON.parse(
  localStorage.getItem("rubikHistory")||"[]"
);


/* =========================
   VECTOR
========================= */

function vecAdd(a,b){
  return [
    a[0]+b[0],
    a[1]+b[1],
    a[2]+b[2]
  ];
}


function vecScale(a,s){
  return [
    a[0]*s,
    a[1]*s,
    a[2]*s
  ];
}


function dot(a,b){
  return a[0]*b[0]+
         a[1]*b[1]+
         a[2]*b[2];
}


function cross(a,b){
  return [
    a[1]*b[2]-a[2]*b[1],
    a[2]*b[0]-a[0]*b[2],
    a[0]*b[1]-a[1]*b[0]
  ];
}


function rot90(v,axis,turns){

  turns=((turns%4)+4)%4;

  let out=v.slice();

  for(let k=0;k<turns;k++){
    out=cross(axis,out);
  }

  return out;
}


function key(n,p){
  return n.join(",")+"|"+p.join(",");
}


/* =========================
   STICKER POSITION
========================= */

function stickerData(face,row,col){

  const info=FACE_INFO[face];

  let p=vecAdd(
    info.n,
    vecAdd(
      vecScale(info.right,col-1),
      vecScale(info.up,1-row)
    )
  );

  return {
    n:info.n.slice(),
    p:p
  };
}


const lookup=new Map();


for(const f of FACES){

  for(let r=0;r<3;r++){

    for(let c=0;c<3;c++){

      const d=stickerData(f,r,c);

      lookup.set(
        key(d.n,d.p),
        {
          f:f,
          r:r,
          c:c
        }
      );

    }

  }

}


/* =========================
   SOLVED CUBE
========================= */

function solvedState(){

  const a=[];

  for(const f of FACES){

    for(let r=0;r<3;r++){

      for(let c=0;c<3;c++){

        a.push({
          f:f,
          r:r,
          c:c,
          color:f
        });

      }

    }

  }

  return a;
}


/* =========================
   APPLY MOVE
========================= */

function rotateMove(move){

  const base=move[0];

  const suf=move.slice(1);

  const turns=
    suf==="2"
      ?2
      :(suf==="'"?3:1);

  const axis=FACE_INFO[base].n;

  const next=[];


  for(const s of state){

    const d=stickerData(
      s.f,
      s.r,
      s.c
    );

    const onLayer=
      dot(axis,d.p)===1;


    if(!onLayer){

      next.push({...s});

      continue;
    }


    const np=rot90(
      d.p,
      axis,
      turns
    );


    const nn=rot90(
      d.n,
      axis,
      turns
    );


    const dest=lookup.get(
      key(nn,np)
    );


    next.push({
      f:dest.f,
      r:dest.r,
      c:dest.c,
      color:s.color
    });

  }


  state=next;
}


/* =========================
   SCRAMBLE
========================= */

function randomScramble(){

  const faces=[
    "R","L","U",
    "D","F","B"
  ];

  const suffix=[
    "",
    "'",
    "2"
  ];

  const axis={
    R:"x",
    L:"x",
    U:"y",
    D:"y",
    F:"z",
    B:"z"
  };

  const out=[];

  let prev="";

  let prevAxis="";


  while(out.length<20){

    const f=
      faces[
        Math.floor(
          Math.random()*faces.length
        )
      ];


    if(
      f===prev ||
      axis[f]===prevAxis
    ){
      continue;
    }


    const m=
      f+
      suffix[
        Math.floor(
          Math.random()*suffix.length
        )
      ];


    out.push(m);

    prev=f;

    prevAxis=axis[f];

  }


  return out;
}


/* =========================
   APPLY SCRAMBLE
========================= */

function applyScramble(){

  state=solvedState();

  scrambleMoves=randomScramble();


  for(const m of scrambleMoves){

    rotateMove(m);

  }


  scrambleText=
    scrambleMoves.join(" ");


  document.getElementById(
    "scramble"
  ).textContent=scrambleText;


  renderCube();
}


/* =========================
   RENDER CUBE
========================= */

function renderCube(){

  const cube=
    document.getElementById("cube");

  cube.innerHTML="";


  for(const f of FACES){

    const face=
      document.createElement("div");

    face.className="face";

    face.id=f;


    for(let r=0;r<3;r++){

      for(let c=0;c<3;c++){

        const s=state.find(
          x=>
            x.f===f &&
            x.r===r &&
            x.c===c
        );


        const el=
          document.createElement("div");

        el.className="sticker";

        el.style.background=
          COLORS[s.color];


        face.appendChild(el);

      }

    }


    cube.appendChild(face);

  }

}


/* =========================
   TIMER
========================= */

function fmt(t){

  return (
    t/1000
  ).toFixed(2);

}


function updateStats(){

  document.getElementById(
    "solves"
  ).textContent=history.length;


  const valid=
    history
      .filter(x=>x.time!=null)
      .map(x=>x.time);


  document.getElementById(
    "pb"
  ).textContent=
    valid.length
      ?fmt(Math.min(...valid))
      :"--";

}


function setTimerColor(c){

  document.getElementById(
    "timer"
  ).style.color=c;

}


function setTimerText(t){

  document.getElementById(
    "timer"
  ).textContent=t;

}


/* =========================
   INSPECTION
========================= */

function inspectionLoop(now){

  if(phase!=="inspection"){
    return;
  }


  const sec=
    (now-inspectionStart)/1000;


  if(sec>=15){

    phase="stopped";

    inspectionArmed=false;

    inspectionHeld=false;


    setTimerText("DNF");

    setTimerColor("#ff3b30");


    history.unshift({

      time:null,

      dnf:true,

      scramble:scrambleText,

      plus2:false

    });


    saveHistory();

    updateStats();

    return;

  }


  const left=15-sec;


  setTimerText(
    Math.ceil(left).toString()
  );


  if(inspectionHeld){

    setTimerColor("#39ff6a");

  }

  else if(left>8){

    setTimerColor("#ff3030");

  }

  else{

    setTimerColor("#ffd52e");

  }


  raf=
    requestAnimationFrame(
      inspectionLoop
    );

}


/* =========================
   START INSPECTION
========================= */

function startInspection(){

  if(
    phase!=="idle" &&
    phase!=="stopped"
  ){
    return;
  }


  phase="inspection";

  inspectionStart=
    performance.now();

  inspectionHeld=false;

  inspectionArmed=false;


  setTimerText("15");

  setTimerColor("#ff3030");


  cancelAnimationFrame(raf);


  raf=
    requestAnimationFrame(
      inspectionLoop
    );

}


/* =========================
   HOLD
========================= */

function beginHold(){

  if(
    phase!=="inspection"
  ){
    return;
  }


  inspectionHeld=true;

  inspectionArmed=true;

  setTimerColor("#39ff6a");

}


/* =========================
   RELEASE
========================= */

function releaseHold(){

  if(
    phase!=="inspection" ||
    !inspectionArmed
  ){
    return;
  }


  inspectionHeld=false;

  inspectionArmed=false;

  phase="solving";


  solveStart=
    performance.now();


  setTimerText("0.00");

  setTimerColor("#ffffff");


  cancelAnimationFrame(raf);


  raf=
    requestAnimationFrame(
      solveLoop
    );

}


/* =========================
   SOLVE LOOP
========================= */

function solveLoop(now){

  if(
    phase!=="solving"
  ){
    return;
  }


  setTimerText(
    fmt(now-solveStart)
  );


  raf=
    requestAnimationFrame(
      solveLoop
    );

}


/* =========================
   FINISH SOLVE
========================= */

function finishSolve(){

  if(
    phase!=="solving"
  ){
    return;
  }


  const t=
    performance.now()-solveStart;


  phase="stopped";


  cancelAnimationFrame(raf);


  setTimerText(
    fmt(t)
  );


  setTimerColor("#ffffff");


  history.unshift({

    time:t,

    dnf:false,

    scramble:scrambleText,

    plus2:false

  });


  saveHistory();

  updateStats();


  applyScramble();

}


/* =========================
   FULL SCREEN TOUCH
========================= */

const page=
  document.getElementById(
    "timerPage"
  );


page.addEventListener(
  "pointerdown",
  timerPointerDown
);


page.addEventListener(
  "pointerup",
  timerPointerUp
);


page.addEventListener(
  "pointercancel",
  timerPointerUp
);


page.addEventListener(
  "pointerleave",
  timerPointerUp
);


function timerPointerDown(e){

  if(
    e.target.closest("button") ||
    e.target.closest("#cube")
  ){
    return;
  }


  if(phase==="solving"){

    finishSolve();

    return;
  }


  if(
    phase==="idle" ||
    phase==="stopped"
  ){

    startInspection();

    return;

  }


  if(
    phase==="inspection"
  ){

    beginHold();

  }

}


function timerPointerUp(e){

  if(
    phase==="inspection"
  ){

    releaseHold();

  }

}


/* =========================
   KEYBOARD SPACE
========================= */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.code!=="Space" ||
      e.repeat
    ){
      return;
    }


    e.preventDefault();


    if(
      phase==="idle" ||
      phase==="stopped"
    ){

      startInspection();

    }

    else if(
      phase==="inspection"
    ){

      beginHold();

    }

    else if(
      phase==="solving"
    ){

      finishSolve();

    }

  }
);


document.addEventListener(
  "keyup",
  e=>{

    if(
      e.code!=="Space"
    ){
      return;
    }


    e.preventDefault();

    releaseHold();

  }
);


/* =========================
   HISTORY
========================= */

function saveHistory(){

  localStorage.setItem(
    "rubikHistory",
    JSON.stringify(history)
  );

  renderHistory();

}


function renderHistory(){

  const list=
    document.getElementById(
      "historyList"
    );


  if(!history.length){

    list.innerHTML=
      '<div class="empty">Chưa có solve nào.</div>';

    return;

  }


  list.innerHTML="";


  history.forEach((x,i)=>{

    const item=
      document.createElement(
        "article"
      );

    item.className="item";


    const top=
      document.createElement(
        "div"
      );

    top.className="itemTop";


    const time=
      document.createElement(
        "div"
      );

    time.className="time";


    time.textContent=
      x.dnf
        ?"DNF"
        :
        fmt(x.time)+
        (x.plus2?"+2":"");


    if(x.dnf){

      time.classList.add("dnf");

    }

    else if(x.plus2){

      time.classList.add("plus2");

    }


    top.appendChild(time);

    item.appendChild(top);


    const sc=
      document.createElement(
        "div"
      );

    sc.className="itemScramble";

    sc.textContent=x.scramble;

    item.appendChild(sc);


    const actions=
      document.createElement(
        "div"
      );

    actions.className="actions";


    if(!x.dnf){

      const p=
        document.createElement(
          "button"
        );


      p.textContent=
        x.plus2
          ?"Remove +2"
          :"+2";


      p.onclick=()=>{

        history[i].plus2=
          !history[i].plus2;

        saveHistory();

        updateStats();

      };


      actions.appendChild(p);

    }


    if(!x.dnf){

      const d=
        document.createElement(
          "button"
        );


      d.textContent="DNF";


      d.onclick=()=>{

        history[i].dnf=true;

        history[i].time=null;

        history[i].plus2=false;

        saveHistory();

        updateStats();

      };


      actions.appendChild(d);

    }


    const del=
      document.createElement(
        "button"
      );


    del.textContent="Delete";


    del.onclick=()=>{

      history.splice(i,1);

      saveHistory();

      updateStats();

    };


    actions.appendChild(del);


    item.appendChild(actions);


    list.appendChild(item);

  });

}


/* =========================
   HISTORY BUTTON
========================= */

document.getElementById(
  "historyBtn"
).onclick=e=>{

  e.stopPropagation();


  document.getElementById(
    "historyPage"
  ).style.display="block";


  renderHistory();

};


/* =========================
   BACK
========================= */

document.getElementById(
  "back"
).onclick=()=>{

  document.getElementById(
    "historyPage"
  ).style.display="none";

};


/* =========================
   CLEAR ALL
========================= */

document.getElementById(
  "clearAll"
).onclick=()=>{

  if(
    confirm(
      "Xóa toàn bộ lịch sử?"
    )
  ){

    history=[];

    saveHistory();

    updateStats();

  }

};


/* =========================
   INIT
========================= */

updateStats();

applyScramble();

</script>

</body>
</html>
